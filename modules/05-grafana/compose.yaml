# 模組 05：Grafana，把 Prometheus 的資料畫成 dashboard
services:
  grafana:
    image: grafana/grafana-oss:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # 不登入也能看 dashboard（Viewer）
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/golden-signals.json
    volumes:
      - "./modules/05-grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./modules/05-grafana/dashboards:/etc/grafana/dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  grafana-data:
